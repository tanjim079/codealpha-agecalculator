<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Age Calculator</title>

    <link rel="stylesheet" href="style.css" />

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Age Calculator</h1>
            <p class="subtitle">
                Calculate exact age in years, months, and days from your date of birth to any selected date.
            </p>

            <div class="form-group">
                <label for="birthDate">Date of Birth</label>
                <input type="date" id="birthDate">
            </div>

            <div class="form-group">
                <label for="targetDate">Calculate Age On</label>
                <input type="date" id="targetDate">
                <small>Default is today's date.</small>
            </div>

            <button onclick="calculateAge()">Calculate Age</button>

            <div class="result-box" id="resultBox">

                <div class="result-item">
                    <span class="number" id="years">0</span>
                    <span class="label">Years</span>
                </div>

                <div class="result-item">
                    <span class="number" id="months">0</span>
                    <span class="label">Months</span>
                </div>

                <div class="result-item">
                    <span class="number" id="days">0</span>
                    <span class="label">Days</span>
                </div>

            </div>

            <p class="full-result" id="fullResult"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
